<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Daftar Akun</title>
</head>
<body>

  <form action="#" method="post">
    <fieldset>
      <legend>Daftar Akun</legend>

      <p>
        <label>Nama Lengkap:</label>
        <input type="text" name="nama_lengkap">
      </p>

      <hr>

      <p>
        Jenis Kelamin:
        <input type="radio" name="jenis_kelamin" value="laki-laki"> Laki-Laki
        <input type="radio" name="jenis_kelamin" value="perempuan"> Perempuan
      </p>

      <hr>

      <p>
        <label>Tempat Lahir:</label>
        <input type="text" name="tempat_lahir">
      </p>

      <hr>

      <p>
        <label>Tanggal Lahir:</label>
        <input type="date" name="tanggal_lahir">
      </p>

      <hr>

      <p>
        <label>Agama:</label>
        <select name="agama">
          <option value="">--- Pilih Agama ---</option>
          <option value="islam">Islam</option>
          <option value="katolik">Katolik</option>
          <option value="protestan">Protestan</option>
          <option value="hindu">Hindu</option>
          <option value="buddha">Buddha</option>
          <option value="konghucu">Konghucu</option>
        </select>
      </p>

      <hr>

      <p>
        Hobi:
        <input type="checkbox" name="hobi" value="olahraga"> Olahraga
        <input type="checkbox" name="hobi" value="membaca"> Membaca
        <input type="checkbox" name="hobi" value="ngoding"> Ngoding
      </p>

      <hr>

      <p>
        <label>Password:</label>
        <input type="password" name="password">
      </p>

      <hr>

      <p>
        <input type="checkbox" name="persetujuan" value="setuju">
        Dengan mendaftar saya setuju dengan Ketentuan dan Kebijakan Privasi Aplikasi.
      </p>

      <p>
        <input type="reset" value="Reset">
        <input type="submit" value="Submit">
      </p>

    </fieldset>
  </form>

</body>
</html>
